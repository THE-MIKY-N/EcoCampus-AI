
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | EcoCampus AI</title>
</head>
<body>
    <h1>EcoCampus AI</h1>
    <h2>Crear cuenta de estudiante</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Registrarme</button>
    </form>

    <p>
        ¿Ya tienes cuenta?
        <a href="{% url 'login' %}">Inicia sesión</a>
    </p>
</body>
</html>
